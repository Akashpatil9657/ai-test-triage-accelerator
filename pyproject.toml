[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-test-triage-accelerator"
version = "0.1.0"
description = "Offline pytest failure clustering and triage brief generator"
requires-python = ">=3.10"

[project.scripts]
ai-test-triage = "triage_accelerator.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
